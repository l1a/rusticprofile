name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  # No `paths:` filter, deliberately (removed in 0.2.50). The `build` legs are required status
  # checks in the ruleset on `main`, and a required check whose workflow is filtered out never
  # reports at all — GitHub then holds the PR at "Expected — waiting for status" forever.
  pull_request:
    branches: [ "main" ]
  # Weekly, so `full-test` runs BEFORE a release instead of only as part of one.
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  checks:
    name: Offline Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run standard, golden, packaging, and text self-tests & checks
        run: |
          python3 scripts/install_completions.py --self-test
          python3 scripts/install_man.py --self-test
          python3 scripts/gate_conformance.py --self-test
          python3 scripts/gate_conformance.py Justfile
          python3 scripts/golden_check.py --self-test
          python3 scripts/man_pages.py --self-test
          python3 scripts/render_packaging.py --self-test
          python3 scripts/aur_check.py --self-test
          python3 scripts/aur_check.py
          python3 scripts/copr_check.py --self-test
          python3 scripts/copr_check.py
          python3 scripts/metadata_check.py --self-test
          python3 scripts/metadata_check.py
          python3 scripts/text_check.py --self-test
          python3 scripts/text_check.py
          python3 scripts/reset_wip.py --self-test
          python3 scripts/reset_wip.py --check-endings

  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    if: >-
      github.ref_type != 'tag'
      && github.event_name != 'schedule'
      && github.event_name != 'push'
    strategy:
      matrix:
        platform: [ubuntu-arm, fedora-x64, macos, windows]
        include:
          - platform: ubuntu-arm
            os: ubuntu-24.04-arm
          - platform: fedora-x64
            os: ubuntu-latest
            container: fedora:latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest

    steps:
      - name: Install dependencies (Fedora)
        if: startsWith(matrix.platform, 'fedora')
        run: |
          dnf install -y git curl gcc make
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Install Rust toolchain (Host)
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Golden argv files are current
        shell: bash
        run: |
          RP_UPDATE_GOLDEN=1 cargo test --test cli_tests golden_ -q
          if [ -n "$(git status --porcelain -- tests/golden)" ]; then
            echo "::error::tests/golden is stale — run 'just golden' and commit the result"
            git --no-pager diff -- tests/golden
            git status --porcelain -- tests/golden
            exit 1
          fi

      - name: Smoke test the binary
        shell: bash
        run: cargo run -- --completions bash > /dev/null

  full-test:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    if: >-
      (github.event_name == 'push' && github.ref_type == 'branch')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'

    strategy:
      matrix:
        platform: [ubuntu-x64, ubuntu-arm, fedora-x64, fedora-arm, macos, windows, windows-arm]
        include:
          - platform: ubuntu-x64
            os: ubuntu-latest
            container: ubuntu:latest
          - platform: ubuntu-arm
            os: ubuntu-24.04-arm
            container: ubuntu:latest
          - platform: fedora-x64
            os: ubuntu-latest
            container: fedora:latest
          - platform: fedora-arm
            os: ubuntu-24.04-arm
            container: fedora:latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: windows-arm
            os: windows-11-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain (Ubuntu Container)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          apt-get update
          apt-get install -y curl build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Install Rust toolchain (Fedora Container)
        if: startsWith(matrix.platform, 'fedora')
        run: |
          dnf install -y curl gcc make
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Install Rust toolchain (Host)
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Run tests (all features)
        run: cargo test --all-features --verbose

      - name: Golden argv files are current
        shell: bash
        run: |
          RP_UPDATE_GOLDEN=1 cargo test --test cli_tests golden_ -q
          if [ -n "$(git status --porcelain -- tests/golden)" ]; then
            echo "::error::tests/golden is stale — run 'just golden' and commit the result"
            git --no-pager diff -- tests/golden
            exit 1
          fi

      - name: Smoke test the binary
        shell: bash
        run: cargo run --release -- --completions bash > /dev/null

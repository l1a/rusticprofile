name: Packaging Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'packaging/**'
      - '.copr/**'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/copr.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'scripts/*_check.py'
      - 'scripts/render_packaging.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify channel descriptions and licences agree with metadata.toml
        run: |
          python3 scripts/metadata_check.py --self-test
          python3 scripts/metadata_check.py
          python3 scripts/brew_check.py --self-test
          python3 scripts/brew_check.py
          python3 scripts/scoop_check.py --self-test
          python3 scripts/scoop_check.py

  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git namcap rust rustic gcc-libs python

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create non-root build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Render the template for the last released tag and build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/aur_check.py
          python3 scripts/render_packaging.py --self-test

          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          V="${TAG#v}"
          URL="https://github.com/l1a/rusticprofile/archive/refs/tags/${TAG}.tar.gz"
          echo "rendering for last released tag: ${TAG}"
          SHA=$(curl -sfL "$URL" | sha256sum | cut -d' ' -f1)

          mkdir -p /tmp/aur-build
          python3 scripts/render_packaging.py --target aur --version "$V" --sha256 "$SHA" \
            --out /tmp/aur-build/PKGBUILD
          chown -R builder:builder /tmp/aur-build

          cd /tmp/aur-build
          su builder -c "makepkg --printsrcinfo" > .SRCINFO
          python3 "$GITHUB_WORKSPACE/scripts/aur_check.py" --dir /tmp/aur-build

          su builder -c "makepkg --syncdeps --noconfirm --check"

      - name: Lint with namcap and verify packaged man page
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/aur-build
          namcap PKGBUILD
          for pkg in *.pkg.tar.zst; do
            echo "=== namcap $pkg ==="
            namcap "$pkg"
          done

          PKG=$(find . -maxdepth 1 -name 'rusticprofile-[0-9]*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
          echo "Verifying man page in $PKG..."
          mkdir -p /tmp/pkg-extract
          tar -xf "$PKG" -C /tmp/pkg-extract
          MAN=/tmp/pkg-extract/usr/share/man/man1/rusticprofile.1.gz
          test -f "$MAN"
          HEADER=$(zcat "$MAN" | sed -n '1p')
          echo "Packaged .TH header: $HEADER"
          if echo "$HEADER" | grep -q '\$'; then
            echo "::error::Man page contains literal unexpanded variable in .TH header: $HEADER"
            exit 1
          fi
          if zcat "$MAN" | grep -qE '^[.](Bl|El|It)\b'; then
            echo "::error::Man page contains raw mdoc macros (.Bl/.El/.It)"
            exit 1
          fi

  copr:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: dnf -y install git make rpm-build rpmdevtools python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the spec is still a template
        run: |
          python3 scripts/copr_check.py --self-test
          python3 scripts/copr_check.py

      - name: Build the SRPM from this checkout (plain environment)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/srpm-plain
          make -f .copr/Makefile srpm outdir=/tmp/srpm-plain
          ls -1 /tmp/srpm-plain

      - name: Build the SRPM under mock's environment (and without .git, to test the tar fallback)
        shell: bash
        run: |
          set -euo pipefail
          cp -a . /tmp/work-nogit
          rm -rf /tmp/work-nogit/.git /tmp/work-nogit/.copr-build
          mkdir -p /builddir /tmp/srpm-mock
          echo "%_topdir /builddir/build" > /builddir/.rpmmacros
          export HOME=/builddir
          echo "HOME=$HOME  _topdir=$(rpmbuild --eval '%{_topdir}')"
          make -C /tmp/work-nogit -f .copr/Makefile srpm outdir=/tmp/srpm-mock
          ls -1 /tmp/srpm-mock

      - name: Verify both SRPMs carry Cargo.toml's version and identical source trees
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/render_packaging.py --print-version)
          for dir in /tmp/srpm-plain /tmp/srpm-mock; do
            srpm=$(find "$dir" -maxdepth 1 -name '*.src.rpm' -print -quit)
            if [ -z "$srpm" ]; then
              echo "::error::no .src.rpm was produced in $dir"
              exit 1
            fi
            echo "$dir -> $(basename "$srpm")"
            case "$(basename "$srpm")" in
              rusticprofile-"$version"-*.src.rpm) ;;
              *)
                echo "::error::SRPM in $dir does not carry Cargo.toml's version ($version)"
                exit 1
                ;;
            esac
          done
          echo "Both SRPMs match Cargo.toml ($version)"

  brew:
    name: Homebrew Formula (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Formula template is valid (offline)
        run: |
          python3 scripts/brew_check.py --self-test
          python3 scripts/brew_check.py
          python3 scripts/render_packaging.py --self-test

      - name: Render the formula for the last released tag
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "::error::no tags in this checkout — cannot render a formula to install"
            exit 1
          fi
          VER="${TAG#v}"
          URL="https://github.com/l1a/rusticprofile/archive/refs/tags/${TAG}.tar.gz"
          echo "last released tag: $TAG"
          curl -sfL -o /tmp/src.tar.gz "$URL" || { echo "::error::cannot fetch $URL"; exit 1; }
          SHA=$(shasum -a 256 /tmp/src.tar.gz | cut -d' ' -f1)
          echo "computed sha256: $SHA"
          python3 scripts/render_packaging.py --target brew --version "$VER" --sha256 "$SHA" \
            --out /tmp/rusticprofile.rb
          grep -q "refs/tags/v${VER}.tar.gz" /tmp/rusticprofile.rb \
            || { echo "::error::rendered formula does not point at $TAG"; exit 1; }
          grep -q "sha256 \"${SHA}\"" /tmp/rusticprofile.rb \
            || { echo "::error::rendered formula does not carry the computed sha256"; exit 1; }
          echo "RENDERED_VER=$VER" >> "$GITHUB_ENV"
          echo "render verified against the real $TAG tarball"

      - name: Ruby syntax
        run: ruby -c /tmp/rusticprofile.rb

      - name: Stage the formula in a local tap
        run: |
          set -euo pipefail
          brew tap-new --no-git local/test
          cp /tmp/rusticprofile.rb "$(brew --repository local/test)/Formula/rusticprofile.rb"
          echo "staged at $(brew --repository local/test)/Formula/rusticprofile.rb"

      - name: Install from source
        run: brew install --build-from-source local/test/rusticprofile

      - name: Run the formula's test block
        run: brew test local/test/rusticprofile

      - name: Audit the formula
        run: brew audit --formula --strict local/test/rusticprofile

      - name: Inspect the installed payload
        run: |
          set -euo pipefail
          PREFIX=$(brew --prefix local/test/rusticprofile)
          echo "prefix: $PREFIX"
          test -x "$PREFIX/bin/rusticprofile"
          "$PREFIX/bin/rusticprofile" --version
          MAN=$(find "$PREFIX/share/man/man1" -name 'rusticprofile.1*' -print -quit)
          [ -n "$MAN" ] || { echo "::error::no man page installed under $PREFIX/share/man/man1"; exit 1; }
          case "$MAN" in *.gz) gunzip -c "$MAN" > /tmp/rusticprofile.1 ;; *) cp "$MAN" /tmp/rusticprofile.1 ;; esac
          head -1 /tmp/rusticprofile.1
          grep -q '^\.TH' /tmp/rusticprofile.1 || { echo "::error::man page has no .TH line"; exit 1; }
          if grep -m1 '^\.TH' /tmp/rusticprofile.1 | grep -q '\$'; then
            echo "::error::man page .TH contains a literal \$"; exit 1
          fi
          MISSING=0
          for f in "$PREFIX/etc/bash_completion.d/rusticprofile" \
                   "$PREFIX/share/zsh/site-functions/_rusticprofile" \
                   "$PREFIX/share/fish/vendor_completions.d/rusticprofile.fish"; do
            if [ -s "$f" ]; then
              echo "  ok  $f ($(wc -c < "$f" | tr -d ' ') bytes)"
            else
              echo "::error::missing or empty completion: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "--- everything actually installed under the prefix ---"
            find "$PREFIX" -type f | sed "s|^$PREFIX/||" | sort
            exit 1
          fi
          echo "payload verified: binary, man page, three completion files"

  scoop:
    name: Scoop Manifest (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Manifest template is valid (offline)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/scoop_check.py --self-test
          python scripts/scoop_check.py
          python scripts/render_packaging.py --self-test

      - name: Render the manifest for the last released tag
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "::error::no tags in this checkout — cannot render a manifest to install"
            exit 1
          fi
          VER="${TAG#v}"
          URL_X64="https://github.com/l1a/rusticprofile/releases/download/${TAG}/rusticprofile-windows-x86_64.exe"
          URL_ARM="https://github.com/l1a/rusticprofile/releases/download/${TAG}/rusticprofile-windows-arm64.exe"
          echo "last released tag: $TAG"
          curl -sfL -o "$RUNNER_TEMP/rusticprofile-windows-x86_64.exe" "$URL_X64" || { echo "::error::cannot fetch $URL_X64"; exit 1; }
          curl -sfL -o "$RUNNER_TEMP/rusticprofile-windows-arm64.exe" "$URL_ARM" || { echo "::error::cannot fetch $URL_ARM"; exit 1; }
          SHA_X64=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$RUNNER_TEMP/rusticprofile-windows-x86_64.exe")
          SHA_ARM=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$RUNNER_TEMP/rusticprofile-windows-arm64.exe")
          echo "computed sha256 x86_64: $SHA_X64"
          echo "computed sha256 arm64:  $SHA_ARM"
          python scripts/render_packaging.py --target scoop --version "$VER" \
            --sha256-x86-64 "$SHA_X64" --sha256-arm64 "$SHA_ARM" \
            --out "$RUNNER_TEMP/rusticprofile.json"
          echo "RENDERED_VER=$VER" >> "$GITHUB_ENV"
          echo "render verified against the real $TAG Windows binaries"

      - name: Install Scoop and verify manifest install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
            $env:PATH = "$HOME\scoop\shims;$env:PATH"
          }
          $bucketDir = Join-Path $env:RUNNER_TEMP "scoop-bucket\bucket"
          New-Item -ItemType Directory -Force -Path $bucketDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\rusticprofile.json" (Join-Path $bucketDir "rusticprofile.json")
          scoop install (Join-Path $bucketDir "rusticprofile.json")
          $verOut = & rusticprofile --version
          Write-Host "Installed: $verOut"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "rusticprofile --version failed with exit code $LASTEXITCODE"
            exit 1
          }
          if ($verOut -notmatch [regex]::Escape($env:RENDERED_VER)) {
            Write-Error "Expected version $($env:RENDERED_VER) in output: $verOut"
            exit 1
          }

name: Security Audit

on:
  push:
    branches: [ "main" ]
  # No `paths:` filter: `audit` is a required status check on `main`, and a filtered-out required
  # check never reports, which blocks the PR forever.
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1

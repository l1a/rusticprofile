name: Rust

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  # Weekly, so `full-test` runs BEFORE a release instead of only as part of one.
  #
  # This closes a real gap rather than adding routine noise. `full-test` is the only job that
  # runs the release-shaped environments — all five platforms, and the Ubuntu and Fedora legs
  # inside bare containers rather than on host runners — and until now it ran only on tags.
  # That is exactly how the v0.1.21 time-zone-database failure passed every pull request and
  # then broke the release: the first thing to exercise those containers was the tag itself,
  # and the bad tag had to be deleted. A suite that is green on every PR and red at tag time
  # has not been run in the environment it ships from.
  #
  # Mondays 06:37 UTC: off the hour, because GitHub queues scheduled workflows submitted at
  # popular times, and a different day from security.yml's Sunday 00:00 audit so that a red
  # week points at one workflow rather than two. A failed scheduled run notifies the repository
  # owner, which is the point — nobody watches a schedule they have to remember to check.
  #
  # Scheduled runs only ever execute on the default branch, so this tests what a release would
  # actually be cut from.
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Windows is in every matrix here as of 0.1.36. The comment that stood in this place said it
  # was "absent on purpose: a declared non-goal for v1 … adding a Windows runner would only
  # prove the crate compiles somewhere it is not meant to run." That is superseded — PLAN.md
  # §7.9 reverses the non-goal, because the machine this project is developed and released from
  # now runs Windows.
  #
  # It is a *pull-request* leg, not only a tag-time one, and that is the point: the alternative
  # was Windows support verified on exactly one developer's machine, which is the v0.1.21 failure
  # restated — a suite green everywhere it runs and never run where it ships. The Windows leg is
  # also the only one that exercises the `share_mode(0)` lock, `GetComputerNameExW`, and the
  # `cfg(not(unix))` branches of `exec` and `main`, none of which any Unix runner can reach.
  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # This is the **pull-request** gate. It is skipped wherever `full-test` runs instead — on
    # version tags, on the weekly schedule, and (since `0.2.1`) on a push to `main` — because on
    # all of those `github.ref_type` is 'branch' for two of the three, so without naming the
    # events explicitly this job would run alongside `full-test` and test the same commit twice.
    #
    # It still runs on `workflow_dispatch`, deliberately: a dispatch is how someone asks for
    # everything, and that is the one case where the overlap is the point.
    if: >-
      github.ref_type != 'tag'
      && github.event_name != 'schedule'
      && github.event_name != 'push'
    # Two platforms are deliberately absent from this matrix and present in `full-test`, so
    # every one of them still runs on every tag and manual dispatch. Both removals follow the
    # same rule: **drop a leg only when it is the intersection of two things each already
    # covered here.** Neither is about saving wall clock — see the note at the end.
    #
    # `fedora-arm` (removed in v0.0.15) was the slowest thing in CI by a wide margin — 19
    # minutes on one merge, essentially all of it `dnf install` plus a from-scratch rustup
    # inside a Fedora container on an ARM runner, and it set the wall clock for every pull
    # request. What it uniquely covered was the *combination* Fedora + aarch64, while
    # `fedora-x64` covers Fedora's toolchain and `ubuntu-arm` covers aarch64.
    #
    # `ubuntu-x64` (removed in v0.1.30) is the same argument without the timing complaint.
    # What it uniquely covered was the combination "Ubuntu host runner + x86_64":
    # `fedora-x64` covers x86_64 Linux, and `ubuntu-arm` covers the Ubuntu userland on a host
    # runner. Stated precisely, because "redundant" is too loose: what is genuinely no longer
    # exercised at pull-request time is `dtolnay/rust-toolchain@stable` *on x86_64*, since the
    # remaining x86_64 leg installs rustup inside a container. That action still runs here on
    # `ubuntu-arm` and `macos`, and on x86_64 in `full-test`. The only platform-specific code
    # in this crate is a handful of `nix` syscalls plus the systemd/launchd split, none of
    # which distinguishes an x86_64 host runner from an x86_64 container.
    #
    # **`macos` must not be removed by the same reasoning, and the case has grown.** It is the
    # only leg that exercises launchd at all — agent generation, `plutil -lint` over every
    # generated plist, and the launchd branches of `schedule`/`unschedule`/`status`. None of it
    # can run on Linux.
    #
    # **What this buys, honestly: less duplicated work, not wall clock and not money.** Measured
    # on the #44 run, `ubuntu-x64` was 37s while `fedora-x64` at 66s set the critical path either
    # way — and Actions minutes are free on a public repository, so v0.1.30's "runner minutes"
    # framing overstated it. What is actually saved is one redundant job per pull request: less
    # queue contention, one less line in the checks list, and less energy for no lost coverage.
    #
    # It did widen the gap that let the v0.1.21 time-zone-database failure pass every pull
    # request and break the release, since `full-test` runs the leaner release-shaped containers.
    # **That gap is now closed from the other side: `full-test` runs weekly (see the `on:`
    # block).** Restoring a duplicated leg is still not the answer if a release goes red.
    strategy:
      matrix:
        platform: [ubuntu-arm, fedora-x64, macos, windows]
        include:
          - platform: ubuntu-arm
            os: ubuntu-24.04-arm
          - platform: fedora-x64
            os: ubuntu-latest
            container: fedora:latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest

    steps:
    - name: Install dependencies (Fedora)
      if: startsWith(matrix.platform, 'fedora')
      run: |
        dnf install -y git curl gcc make
        # A pipeline's exit status is its LAST command's, so `curl ... | sh` reports success
        # when curl fails: `sh` fed nothing exits 0. GitHub runs these with `sh -e`, which does
        # not fire for that. Fetch first, then run, so a failed download fails THIS step.
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
        sh /tmp/rustup-init.sh -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        # POST-CONDITION: adding a directory to PATH is not evidence a toolchain is in it.
        # Without this the step reports success and the *next* step dies with
        # `cargo: command not found`, which reads as a code failure rather than a setup one --
        # it cost a full CI cycle on #71, where fail-fast then cancelled two sibling legs so one
        # environmental failure was reported as three. Absolute paths because $GITHUB_PATH only
        # affects LATER steps, not this one.
        "$HOME/.cargo/bin/cargo" --version
        "$HOME/.cargo/bin/rustc" --version

    - name: Install Rust toolchain (Host)
      if: ${{ !matrix.container }}
      uses: dtolnay/rust-toolchain@stable

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Format check
      run: cargo fmt -- --check
    - name: Clippy
      # `--all-targets` so `#[cfg(test)]` code is linted too. Without it clippy never sees a
      # test module at all, which had been true since the scaffold. Watched failing rather than
      # assumed: a `len_zero` planted inside a `#[cfg(test)] mod` exits 0 without the flag and
      # 101 with it.
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Golden argv files are current
      # `just check` enforces this locally via the pre-push hook, but CI runs the cargo
      # commands directly and `just` is not installed on every runner — so without this
      # step a stale golden could reach main by bypassing the hook. Regenerate and require
      # no change: the argv rusticprofile would run must never drift silently.
      shell: bash
      run: |
        RP_UPDATE_GOLDEN=1 cargo test --test cli_tests golden_ -q
        if [ -n "$(git status --porcelain -- tests/golden)" ]; then
          echo "::error::tests/golden is stale — run 'just golden' and commit the result"
          git --no-pager diff -- tests/golden
          git status --porcelain -- tests/golden
          exit 1
        fi
    - name: Smoke test the binary
      # Completion generation is the one code path that produces real output today, so
      # it is what a smoke test can meaningfully assert on.
      #
      # `shell: bash` is required, not cosmetic: the default shell on a Windows runner is
      # PowerShell, where `> /dev/null` creates a *file* called `dev\null` instead of
      # discarding — so the step would either fail on the missing directory or silently leave
      # a file behind, and in neither case would it be the smoke test it claims to be.
      shell: bash
      run: cargo run -- --completions bash > /dev/null

  full-test:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # Version tags, a push to a branch (i.e. a merge to `main`), the weekly schedule, or a manual
    # dispatch.
    #
    # **A merge runs this, as of `0.2.1`.** Before, a merge ran only `build` — four host-runner
    # legs — so `main` was never checked in the release-shaped containers between one release and
    # the next. That is the `v0.1.21` gap seen from a third angle: the suite that ships was not
    # run on the branch it ships from. The weekly schedule (`0.1.31`) narrowed the window; this
    # closes it, at the cost of a 7-platform matrix per merge, which is the right trade for the
    # one branch releases are cut from.
    #
    # `ref_type == 'branch'` is load-bearing on the push clause: a **tag** push is also
    # `event_name == 'push'`, and without it a tag would match twice.
    #
    # `build-release` and `release` stay tag-only, so a merge or a weekly run tests everything and
    # publishes nothing.
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'push' && github.ref_type == 'branch')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'

    strategy:
      matrix:
        platform: [ubuntu-x64, ubuntu-arm, fedora-x64, fedora-arm, macos, windows, windows-arm]
        include:
          - platform: ubuntu-x64
            os: ubuntu-latest
            container: ubuntu:latest
          - platform: ubuntu-arm
            os: ubuntu-24.04-arm
            container: ubuntu:latest
          - platform: fedora-x64
            os: ubuntu-latest
            container: fedora:latest
          - platform: fedora-arm
            os: ubuntu-24.04-arm
            container: fedora:latest
          - platform: macos
            os: macos-latest
          # No container equivalent, so these are the release-shaped environments for Windows —
          # the same runners `build-release` uses.
          - platform: windows
            os: windows-latest
          # aarch64-pc-windows-msvc. Tag-time only, like `fedora-arm`: it is the second
          # architecture of a platform already covered at pull-request time, and the only
          # thing it uniquely exercises is the toolchain on aarch64 — there is no
          # architecture-dependent code in this crate.
          - platform: windows-arm
            os: windows-11-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install Rust toolchain (Ubuntu Container)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        apt-get update
        apt-get install -y curl build-essential
        # A pipeline's exit status is its LAST command's, so `curl ... | sh` reports success
        # when curl fails: `sh` fed nothing exits 0. GitHub runs these with `sh -e`, which does
        # not fire for that. Fetch first, then run, so a failed download fails THIS step.
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
        sh /tmp/rustup-init.sh -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        # POST-CONDITION: adding a directory to PATH is not evidence a toolchain is in it.
        # Without this the step reports success and the *next* step dies with
        # `cargo: command not found`, which reads as a code failure rather than a setup one --
        # it cost a full CI cycle on #71, where fail-fast then cancelled two sibling legs so one
        # environmental failure was reported as three. Absolute paths because $GITHUB_PATH only
        # affects LATER steps, not this one.
        "$HOME/.cargo/bin/cargo" --version
        "$HOME/.cargo/bin/rustc" --version

    - name: Install Rust toolchain (Fedora Container)
      if: startsWith(matrix.platform, 'fedora')
      run: |
        dnf install -y curl gcc make
        # A pipeline's exit status is its LAST command's, so `curl ... | sh` reports success
        # when curl fails: `sh` fed nothing exits 0. GitHub runs these with `sh -e`, which does
        # not fire for that. Fetch first, then run, so a failed download fails THIS step.
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
        sh /tmp/rustup-init.sh -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        # POST-CONDITION: adding a directory to PATH is not evidence a toolchain is in it.
        # Without this the step reports success and the *next* step dies with
        # `cargo: command not found`, which reads as a code failure rather than a setup one --
        # it cost a full CI cycle on #71, where fail-fast then cancelled two sibling legs so one
        # environmental failure was reported as three. Absolute paths because $GITHUB_PATH only
        # affects LATER steps, not this one.
        "$HOME/.cargo/bin/cargo" --version
        "$HOME/.cargo/bin/rustc" --version

    - name: Install Rust toolchain (Host)
      if: ${{ !matrix.container }}
      uses: dtolnay/rust-toolchain@stable

    # Cheapest first, and the order is deliberate rather than inherited. `cargo fmt --check`
    # compiles nothing and takes about a second, and it used to run second to LAST here -- after
    # a full `--release` build and the whole suite, on all seven legs (73-123 s each, measured on
    # the `8f9a12d` merge). A missing trailing newline paid all of that before anyone heard
    # about it. `build` has always had this order; the expensive job had it inverted.
    #
    # This saves time on FAILURE, not on success: a green run does the same work either way.
    # What changes is how fast a red one reports, and how much runner time a trivial mistake
    # burns.
    - name: Format check
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build (release)
      run: cargo build --release --verbose

    - name: Run tests (all features)
      run: cargo test --all-features --verbose

    # Duplicated from `build` rather than left there, and the duplication is the cheaper half of
    # the trade. `build` no longer runs on a merge and never ran on a tag, so these two checks
    # would otherwise be absent from exactly the commits that ship: a stale golden could reach a
    # release, and nothing would have run the binary at all.
    #
    # They are seconds each. Losing them on the release path to avoid repeating them would be
    # optimising the wrong thing.
    - name: Golden argv files are current
      shell: bash
      run: |
        RP_UPDATE_GOLDEN=1 cargo test --test cli_tests golden_ -q
        if [ -n "$(git status --porcelain -- tests/golden)" ]; then
          echo "::error::tests/golden is stale — run 'just golden' and commit the result"
          git --no-pager diff -- tests/golden
          exit 1
        fi

    - name: Smoke test the binary
      # `shell: bash` for the same reason as in `build`: the Windows runner's default shell is
      # PowerShell, where `> /dev/null` creates a file called `dev\null` instead of discarding.
      shell: bash
      run: cargo run --release -- --completions bash > /dev/null

  build-release:
    needs: full-test
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    if: (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        platform: [fedora-x64, fedora-arm, macos, windows, windows-arm]
        include:
          - platform: fedora-x64
            os: ubuntu-latest
            container: fedora:latest
            artifact_name: release-assets-linux-x86_64
          - platform: fedora-arm
            os: ubuntu-24.04-arm
            container: fedora:latest
            artifact_name: release-assets-linux-arm64
          - platform: macos
            os: macos-latest
            artifact_name: release-assets-macos-arm64
          # A platform that is supported but has no downloadable binary is supported only for
          # people who already have a Rust toolchain, so these ship alongside the others. Both
          # architectures, matching what Linux gets — an arm64 Windows laptop is exactly the
          # machine least likely to have a toolchain on it.
          - platform: windows
            os: windows-latest
            artifact_name: release-assets-windows-x86_64
          - platform: windows-arm
            os: windows-11-arm
            artifact_name: release-assets-windows-arm64

    steps:
      - name: Install system dependencies (Fedora)
        if: startsWith(matrix.platform, 'fedora')
        run: dnf install -y git curl gcc make

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain (Fedora)
        if: startsWith(matrix.platform, 'fedora')
        run: |
          # A pipeline's exit status is its LAST command's, so `curl ... | sh` reports success
          # when curl fails: `sh` fed nothing exits 0. GitHub runs these with `sh -e`, which does
          # not fire for that. Fetch first, then run, so a failed download fails THIS step.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          # POST-CONDITION: adding a directory to PATH is not evidence a toolchain is in it.
          # Without this the step reports success and the *next* step dies with
          # `cargo: command not found`, which reads as a code failure rather than a setup one --
          # it cost a full CI cycle on #71, where fail-fast then cancelled two sibling legs so one
          # environmental failure was reported as three. Absolute paths because $GITHUB_PATH only
          # affects LATER steps, not this one.
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Install Rust toolchain (Host)
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          case "${{ matrix.platform }}" in
            fedora-x64) cp target/release/rusticprofile release/rusticprofile-linux-x86_64 ;;
            fedora-arm) cp target/release/rusticprofile release/rusticprofile-linux-arm64 ;;
            macos)      cp target/release/rusticprofile release/rusticprofile-macos-arm64 ;;
            # Keeps the `.exe` suffix: Windows needs it to execute the file at all, so
            # renaming it to match the others' bare names would ship something unrunnable.
            windows)     cp target/release/rusticprofile.exe release/rusticprofile-windows-x86_64.exe ;;
            windows-arm) cp target/release/rusticprofile.exe release/rusticprofile-windows-arm64.exe ;;
          esac
          cp docs/rusticprofile.1 release/ || true

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release/

  release:
    needs: build-release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')

    permissions:
      contents: write   # Required to create GitHub Releases

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: release-assets-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          name: rusticprofile ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/rusticprofile-linux-x86_64
            release/rusticprofile-linux-arm64
            release/rusticprofile-macos-arm64
            release/rusticprofile-windows-x86_64.exe
            release/rusticprofile-windows-arm64.exe
            release/rusticprofile.1
          generate_release_notes: true

      - name: Clean up rc pre-releases and prune old releases (keep 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"

          # Delete all rc pre-releases for this version
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq ".[] | select(.tagName | startswith(\"${VERSION}-rc.\")) | .tagName" \
          | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag

          # Keep only the 10 most recent stable releases
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease | not)][10:][].tagName' \
          | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag

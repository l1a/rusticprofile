name: COPR Rebuild

# Triggers a rebuild of the COPR package when a release is tagged, and pushes the COPR
# project page's description and instructions from packaging/copr/project-*.md.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install copr-cli
        run: dnf -y install copr-cli git python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse unless Cargo.toml matches the released tag
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          V=$(python3 scripts/render_packaging.py --print-version)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(git describe --tags --abbrev=0)
            echo "manual run: comparing against the last tag, $TAG"
          fi
          echo "Cargo.toml: $V"
          echo "tag:        $TAG"
          if [ "v$V" != "$TAG" ]; then
            echo "::error::Cargo.toml is $V but the tag is $TAG — refusing to build a version that was not released"
            exit 1
          fi
          echo "will build rusticprofile $V"

      - name: Configure copr-cli
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          # A fork has no secrets, and a red check there would be noise about a credential the
          # fork is not supposed to have, so a fork skips. THIS repo must fail instead: a skip
          # that exits 0 here reports a green rebuild that submitted nothing.
          # scripts/copr_check.py --self-test runs this step to hold both halves.
          if [ -z "${COPR_LOGIN:-}" ] || [ -z "${COPR_TOKEN:-}" ] || [ -z "${COPR_USERNAME:-}" ]; then
            if [ "${GITHUB_REPOSITORY:-}" = "l1a/rusticprofile" ]; then
              echo "::error::COPR credentials missing on l1a/rusticprofile; nothing would be rebuilt. Set COPR_LOGIN, COPR_USERNAME and COPR_TOKEN."
              exit 1
            fi
            echo "::notice::COPR credentials not configured on this fork; skipping the rebuild"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "login = $COPR_LOGIN"
            echo "username = $COPR_USERNAME"
            echo "token = $COPR_TOKEN"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } > ~/.config/copr
          chmod 600 ~/.config/copr
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Sync the COPR project description and instructions
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          python3 scripts/metadata_check.py
          copr-cli modify \
            --description "$(cat packaging/copr/project-description.md)" \
            --instructions "$(cat packaging/copr/project-instructions.md)" \
            kentobias/rusticprofile
          echo "COPR project description and instructions synced from packaging/copr/project-*.md"

      - name: Rebuild the COPR package
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            REF="$GITHUB_REF_NAME"
          else
            REF=$(git describe --tags --abbrev=0)
          fi

          copr-cli buildscm \
            --clone-url https://github.com/l1a/rusticprofile.git \
            --commit "$REF" \
            --method make_srpm \
            --enable-net on \
            kentobias/rusticprofile

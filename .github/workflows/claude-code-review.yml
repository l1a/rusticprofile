name: Claude Code Review

# Automatic review on every pull request.
#
# Read-only by design: this job reviews, it does not push. Anything that needs to change
# the repository goes through `claude.yml`, which is triggered deliberately by an @claude
# mention and has the write permissions to match.
#
# A GREEN CHECK HERE DOES NOT PROVE A REVIEW HAPPENED. The action requires this file to be
# byte-identical to the copy on the default branch and skips with a `success` conclusion
# when it is not — so any pull request editing this file gets no review, silently. That is
# a security control (it stops a PR rewriting the workflow and running it with the
# repository's secret), not a fault. When changing this file, read the job log for
# `Workflow validation failed` rather than trusting the check mark.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Dependabot opens PRs as a bot actor, and the action refuses non-human actors
          # unless they are named. Without this, exactly the PRs least likely to get a
          # human read would also get no review. Scoped to dependabot alone.
          allowed_bots: 'dependabot[bot]'
          # Always leave a visible summary, even when the review finds nothing.
          #
          # Without this the action posts only when it has findings, so "reviewed and found
          # nothing" and "skipped without running" are indistinguishable: both are a green
          # check and silence. Measured on PR #2 — a full 11-turn review ran and posted
          # nothing at all. A sticky comment is updated in place rather than accumulating,
          # so the cost is one comment per PR.
          use_sticky_comment: true

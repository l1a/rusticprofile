[package]
name = "rusticprofile"
version = "0.2.7"
edition = "2024"
authors = ["Ken Tobias"]
description = "A local, per-machine scheduler and orchestrator for rustic backups"
license = "GPL-3.0-or-later"
repository = "https://github.com/l1a/rusticprofile"
readme = "README.md"
keywords = ["backup", "rustic", "scheduler", "systemd", "cli"]
categories = ["command-line-utilities"]
exclude = [
    ".clauderc",
    "AGENTS.md",
    "CLAUDE.md",
    "NOTES.md",
    "PLAN.md",
    "Justfile",
    "scripts/",
    "packaging/",
    ".github/",
]

[[bin]]
name = "rusticprofile"
path = "src/main.rs"

# Dependencies are added as the milestone that needs them lands, not up front.
# The full planned set is recorded in NOTES.md "Current State" — serde/serde_yaml_ng and toml
# arrive with `config/` (M1 step 2), serde_json and jiff with the runner, nix and
# semver with exec and version checks.
[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
anyhow = "1.0"
owo-colors = "4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
toml = "1.1.4"
dirs = "6.0.0"
jiff = "0.2.35"
serde_json = "1.0.151"

# `nix` is Unix-only, and moving it here rather than leaving it unconditional is documentation
# as much as mechanics: it builds on Windows as an *empty* crate, so an unconditional entry
# compiles fine and then fails at every use site with `could not find sys in nix` — an error
# that reads like a feature-flag problem rather than a platform one.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = [
    "fs",
    "hostname",
    "process",
    "signal",
    "user",
] }

# Two uses, both of which earn the dependency because the obvious alternative is wrong.
#
# `GetComputerNameExW`: `%COMPUTERNAME%` is the *NetBIOS* name, which Windows reports upper-cased.
# Emitting `HOST-A` where every other host in a fleet records `host-a` would put one machine in its
# own retention group under `group-by = "host,label"` and strand its history — invariant 1 in
# `NOTES.md` §3a, breached by a value that looks merely cosmetic. See `PLAN.md` §5.10.
#
# Job objects: Windows has no signal to forward, so the only way to guarantee rustic dies with
# rusticprofile is `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE`. Without it, a scheduled task that is
# stopped kills the parent and leaves rustic writing to the repository.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",             # SECURITY_ATTRIBUTES, in CreateJobObjectW's signature
    "Win32_System_Console",       # FreeConsole, for `run --background`
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",     # gates JOBOBJECT_EXTENDED_LIMIT_INFORMATION itself
] }

# Optimised like release but with full debug symbols, so samply / cargo-flamegraph
# produce useful annotated stacks.
[profile.profiling]
inherits = "release"
debug = true

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
